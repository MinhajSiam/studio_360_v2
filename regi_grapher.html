<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Photographer | Studio360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* Custom Font */
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }

        ::-webkit-scrollbar-thumb {
            background: #ef4444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b91c1c;
        }

        /* Custom Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Staggered delays for sections */
        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .delay-500 {
            animation-delay: 0.5s;
        }

        /* Input Focus Float Effect */
        .input-group:focus-within {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }

        /* Gradient Button Hover */
        .btn-gradient {
            background-size: 200% auto;
            transition: 0.5s;
        }

        .btn-gradient:hover {
            background-position: right center;
        }

        /* Image Preview Custom Styles */
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 16px;
            position: relative;
            z-index: 20;
        }

        .preview-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #fca5a5;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeInScale 0.3s ease-out forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center text-gray-800">

    <div
        class="max-w-4xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-white/50 animate-fade-in-up backdrop-blur-sm">

        <div class="bg-white py-10 px-8 md:px-12 relative overflow-hidden border-b border-gray-100">
            <div
                class="absolute top-0 right-0 w-72 h-72 bg-red-50 rounded-full blur-3xl opacity-60 transform translate-x-1/3 -translate-y-1/3">
            </div>

            <div class="flex flex-col md:flex-row items-center justify-between relative z-10">
                <div class="flex items-center space-x-5">
                    <div
                        class="w-16 h-16 bg-gradient-to-br from-red-500 to-red-700 rounded-2xl flex items-center justify-center shadow-lg shadow-red-600/30 transform -rotate-3 transition-transform duration-300 hover:rotate-0">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                            </path>
                            <circle cx="12" cy="13" r="4" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"></circle>
                        </svg>
                    </div>
                    <div class="text-center md:text-left">
                        <h1 class="text-4xl md:text-5xl font-black text-gray-900 tracking-tight uppercase">
                            Studio<span class="text-red-600">360</span>
                        </h1>
                        <p class="text-[10px] sm:text-xs font-bold text-gray-400 tracking-[0.25em] uppercase mt-1">
                            Professional Creators</p>
                    </div>
                </div>

                <div class="mt-6 md:mt-0 flex flex-col items-center md:items-end">
                    <div
                        class="inline-flex items-center px-5 py-2.5 bg-red-50 rounded-full border border-red-100 shadow-sm">
                        <span class="relative flex h-3 w-3 mr-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600"></span>
                        </span>
                        <span class="text-sm font-bold text-red-700 tracking-wide">ফটোগ্রাফার পোর্টাল</span>
                    </div>
                </div>
            </div>
        </div>

        <form id="photographerRegistrationForm" class="py-10 px-8 md:px-12 space-y-10 bg-white">

            <div class="animate-fade-in-up delay-100">
                <div class="flex items-center mb-6">
                    <span class="bg-red-100 text-red-600 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </span>
                    <h2 class="text-2xl font-bold text-gray-800">ব্যক্তিগত তথ্য</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">পূর্ণ নাম <span
                                class="text-red-500">*</span></label>
                        <input type="text" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="আপনার নাম লিখুন">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">ইমেইল এড্রেস <span
                                class="text-red-500">*</span></label>
                        <input type="email" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="example@email.com">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">যোগাযোগের নম্বর <span
                                class="text-red-500">*</span></label>
                        <input type="tel" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="01XXX-XXXXXX">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">বর্তমান ঠিকানা <span
                                class="text-red-500">*</span></label>
                        <input type="text" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="আপনার ঠিকানা">
                    </div>
                </div>
            </div>

            <div class="h-px bg-gradient-to-r from-transparent via-gray-200 to-transparent my-8"></div>

            <div class="animate-fade-in-up delay-200">
                <div class="flex items-center mb-6">
                    <span class="bg-red-100 text-red-600 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </span>
                    <h2 class="text-2xl font-bold text-gray-800">গিয়ার এবং দক্ষতা</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">ক্যামেরা বডি <span
                                class="text-red-500">*</span></label>
                        <input type="text" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="যেমন: Sony A7IV, Canon R6">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">লেন্স কালেকশন <span
                                class="text-red-500">*</span></label>
                        <input type="text" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="যেমন: 24-70mm f2.8, 85mm f1.8">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">বিশেষজ্ঞতা (Specialty) <span
                                class="text-red-500">*</span></label>
                        <select required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm appearance-none cursor-pointer">
                            <option value="">নির্বাচন করুন</option>
                            <option value="wedding">ওয়েডিং ও ইভেন্ট</option>
                            <option value="fashion">ফ্যাশন ও পোর্ট্রেট</option>
                            <option value="product">প্রোডাক্ট ও কমার্শিয়াল</option>
                            <option value="all">অলরাউন্ডার</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">লাইটস্ট্যান্ড ও ফ্ল্যাশ
                            কালেকশন</label>
                        <input type="text"
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="যেমন: Godox AD200, V860III (যদি থাকে)">
                    </div>
                </div>
            </div>

            <div class="h-px bg-gradient-to-r from-transparent via-gray-200 to-transparent my-8"></div>

            <div class="animate-fade-in-up delay-300">
                <div class="flex items-center mb-6">
                    <span class="bg-red-100 text-red-600 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </span>
                    <h2 class="text-2xl font-bold text-gray-800">পেশাগত অভিজ্ঞতা</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">কাজের অভিজ্ঞতা <span
                                class="text-red-500">*</span></label>
                        <select required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm appearance-none cursor-pointer">
                            <option value="">নির্বাচন করুন</option>
                            <option value="1">১-২ বছর</option>
                            <option value="3">৩-৫ বছর</option>
                            <option value="5+">৫ বছরের বেশি</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2">পোর্টফোলিও লিংক <span
                                class="text-red-500">*</span></label>
                        <input type="url" required
                            class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all duration-300 shadow-sm"
                            placeholder="Behance / Google Drive / Website">
                    </div>
                </div>
            </div>

            <div class="h-px bg-gradient-to-r from-transparent via-gray-200 to-transparent my-8"></div>

            <div class="animate-fade-in-up delay-400">
                <div class="flex items-center mb-6">
                    <span class="bg-red-100 text-red-600 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                    </span>
                    <h2 class="text-2xl font-bold text-gray-800">সেরা কাজের নমুনা</h2>
                </div>

                <div class="relative group cursor-pointer w-full">
                    <input type="file" id="workSamples" accept="image/*" multiple
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                    <div
                        class="h-full border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center group-hover:border-red-500 group-hover:bg-red-50 transition-all duration-300 bg-gray-50 flex flex-col justify-center items-center">
                        <div
                            class="bg-white w-16 h-16 rounded-full flex items-center justify-center mb-4 shadow-md group-hover:scale-110 transition-transform duration-300">
                            <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-gray-700 group-hover:text-red-600 mb-2">আপনার তোলা সেরা ৫-১০টি
                            ছবি আপলোড করুন</h3>
                        <p class="text-sm text-gray-500 font-medium">(একাধিক ছবি একসাথে সিলেক্ট করতে পারবেন)</p>

                        <div id="workSamplesPreview" class="image-preview-grid w-full mt-6"></div>
                    </div>
                </div>
            </div>

            <div class="pt-8 animate-fade-in-up delay-500">
                <button type="submit"
                    class="btn-gradient w-full bg-gradient-to-r from-red-600 via-red-500 to-red-600 text-white font-bold text-xl py-4 rounded-xl shadow-lg shadow-red-500/30 hover:shadow-red-500/50 focus:outline-none focus:ring-4 focus:ring-red-300 transform active:scale-95">
                    আবেদন জমা দিন
                </button>
            </div>

            <div id="successMessage"
                class="hidden mt-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 rounded-r-lg shadow-sm flex items-center animate-fade-in-up">
                <svg class="w-6 h-6 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">অভিনন্দন! আপনার আবেদন সফলভাবে জমা হয়েছে। আমরা শীঘ্রই যোগাযোগ করবো।</span>
            </div>

        </form>
    </div>

    <script>
        // Multiple File Upload with Image Preview
        document.getElementById('workSamples').addEventListener('change', function (e) {
            const container = document.getElementById('workSamplesPreview');
            container.innerHTML = ''; // Clear previous

            const files = e.target.files;
            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    if (!file.type.startsWith('image/')) return;

                    const reader = new FileReader();
                    reader.onload = function (event) {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.className = 'preview-item';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            }
        });

        // Form submission animation
        document.getElementById('photographerRegistrationForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const successMsg = document.getElementById('successMessage');

            // Button loading state
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<svg class="animate-spin h-6 w-6 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> প্রসেসিং...`;

            // Simulate network request
            setTimeout(() => {
                submitBtn.innerHTML = originalText;
                successMsg.classList.remove('hidden');

                // Form reset after showing message
                setTimeout(() => {
                    this.reset();
                    document.getElementById('workSamplesPreview').innerHTML = '';
                    successMsg.classList.add('hidden');
                }, 4000);
            }, 1500);
        });
    </script>
</body>

</html>
